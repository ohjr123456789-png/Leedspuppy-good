  --warn:#8A4B05; --warn-bg:#FFEDC2; --bad:#B3261E; --bad-bg:#FDE3E0; --ok:#1F7A45;
  --focus:#2B6CE0; --scrim:rgba(60,40,20,.5);
  --shadow:0 1px 2px rgba(74,50,34,.08),0 10px 28px rgba(74,50,34,.10);
  --gx:max(16px,env(safe-area-inset-left,0px));
  --gxr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F1812; --surface:#2A2018; --surface-2:#30251C;
    --ink:#F6EBDA; --ink-2:#CDBBA4; --mute:#B5A18B; --brand:#D9B48A;
    --line:#4A3A2B; --line-2:#3A2D22;
    --val:#7CC4EE; --val-bg:#17384D; --val-ink:#8FD0F5; --on-val:#0B2A3E;
    --term:#F59DB4; --term-bg:#4A2230; --term-ink:#FFB3C4; --on-term:#3C1020;
    --warn:#F5B66A; --warn-bg:#3A2810; --bad:#FF9A92; --bad-bg:#3E1C1A; --ok:#6FD39A;
    --focus:#8FB8FF; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1812; --surface:#2A2018; --surface-2:#30251C;
  --ink:#F6EBDA; --ink-2:#CDBBA4; --mute:#B5A18B; --brand:#D9B48A;
  --line:#4A3A2B; --line-2:#3A2D22;
  --val:#7CC4EE; --val-bg:#17384D; --val-ink:#8FD0F5; --on-val:#0B2A3E;
  --term:#F59DB4; --term-bg:#4A2230; --term-ink:#FFB3C4; --on-term:#3C1020;
  --warn:#F5B66A; --warn-bg:#3A2810; --bad:#FF9A92; --bad-bg:#3E1C1A; --ok:#6FD39A;
  --focus:#8FB8FF; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,p{margin:0}

.app{display:grid;grid-template-columns:minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pane-list{min-width:0;padding-bottom:40px}
.pane-detail{min-width:0}

/* 목록 머리 */
.listhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;flex-wrap:wrap}
.btns{display:flex;gap:8px}
.brand h1{font:400 26px/1.1 var(--font-display);letter-spacing:.04em;color:var(--brand)}
.brandl{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--brand);background:#FFFEEC}
.brand small b{font-weight:600;color:var(--ink-2)}
.btns{width:100%}
.btns .btn.primary{flex:1}
.brand small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:6px}
.dotstat{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.dotstat.ok{background:var(--ok)} .dotstat.warn{background:var(--warn)}
.search{position:relative;margin-top:12px}
.search input{width:100%;min-height:48px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip b{font-weight:600;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 요약 */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:8px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sum>div{padding:10px 12px;min-width:0}
.sum>div+div{border-left:1px solid var(--line-2)}
.sumbtn{min-width:0;padding:10px 12px;text-align:left;background:transparent;border:0;border-left:1px solid var(--line-2);border-radius:0 13px 13px 0;color:inherit}
.sumbtn span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumbtn b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumbtn:hover:not(:disabled){background:var(--surface-2)}
.sumbtn:not(:disabled) b{color:var(--warn)}
.sumbtn[aria-pressed="true"]{background:var(--warn-bg)}
.sumbtn[aria-pressed="true"] span{color:var(--warn);font-weight:600}
.sumbtn:disabled{cursor:default}
.sum span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.listbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 2px 8px;font-size:13px;color:var(--mute)}
.listbar select{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px;font-size:13px}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 4px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:500}

.note.bad{background:var(--bad-bg);color:var(--bad)}
#banner{display:grid;gap:8px}
.aud{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:grid;gap:8px;justify-items:start}
.aud ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.h3{font-size:13px;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:8px 0 0}
.snaps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.snap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.snap small{display:block;font-size:12px;color:var(--mute)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--ink)}
.av{color:var(--brand);width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:400 18px/1 var(--font-display)}
.rmain{display:block;min-width:0}
.rname{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.smp{font-style:normal;font-size:11px;font-weight:600;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--mute);vertical-align:1px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.7;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag.val{background:var(--val-bg);color:var(--val-ink)}
.tag.term{background:var(--term-bg);color:var(--term-ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.mute{background:var(--surface-2);color:var(--mute);border:1px solid var(--line)}

.empty{display:grid;justify-items:center;gap:12px;text-align:center;padding:40px 16px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty strong{font:400 22px/1.2 var(--font-display);color:var(--ink)}
.elogo{width:min(200px,60%);height:auto;border-radius:28px}
.empty svg{width:44px;height:44px;stroke:var(--mute);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.skel{height:76px;border-bottom:1px solid var(--line-2);background:linear-gradient(90deg,transparent,var(--surface-2),transparent);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.val{background:var(--val);color:var(--on-val);border-color:transparent}
.btn.term{background:var(--term);color:var(--on-term);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.on{background:var(--bad);color:var(--bg)}
.btn.block{width:100%;min-height:52px;font-size:16px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border-color:transparent;padding:0 8px;margin-left:-8px;color:var(--ink-2)}
.link{background:none;border:0;padding:0 6px;min-height:36px;color:var(--ink-2);text-decoration:underline;font-size:13px}
.link.danger{color:var(--bad)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:30px;padding:0 10px;font-size:12px;font-weight:600;margin-left:8px}

/* 상세 */
.back{display:none}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:8px 0 6px}
.dname{font:400 32px/1.2 var(--font-display);text-wrap:balance;overflow-wrap:anywhere}
.dsub{margin-top:4px;color:var(--ink-2);overflow-wrap:anywhere}
.dmemo{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:14px;max-width:60ch;overflow-wrap:anywhere}
.dtools{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px}
.sec h2{font-size:13px;letter-spacing:.06em;color:var(--mute);font-weight:600}
.passes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}

.pass{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.pass.ended{box-shadow:none;background:var(--surface-2)}
.pass.ended .big{opacity:.55}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .ttl{font-weight:700;flex:1 1 120px;min-width:0;overflow-wrap:anywhere}
.big{font:400 38px/1.15 var(--font-display);font-variant-numeric:tabular-nums;margin:14px 0 2px;overflow-wrap:anywhere}
.big small{font-size:20px;margin-left:3px}
.pass.v .big{color:var(--val-ink)}
.pass.t .big{color:var(--term-ink)}
.meter{width:100%;height:8px;border-radius:99px;overflow:hidden;display:block;margin:10px 0 8px}
.meter .bg{fill:var(--line-2)}
.meter .fg{fill:var(--val)}
.cap{font-size:13px;color:var(--mute)}
.cap.warn{color:var(--warn);font-weight:600}
.cap.bad{color:var(--bad);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.dot{width:26px;height:26px;border-radius:50%;border:2px dashed var(--term);display:grid;place-items:center}
.dot.used{background:var(--term);border:2px solid var(--term)}
.dot svg{width:14px;height:14px;stroke:var(--on-term);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:16px -17px}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-8px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-8px;clip-path:inset(0 50% 0 0)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .grow{flex:1 1 140px}

.hist{margin-top:12px}
.hist summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);min-height:36px;display:flex;align-items:center;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist summary::before{content:"▸";margin-right:6px;display:inline-block;transition:transform .15s}
.hist[open] summary::before{transform:rotate(90deg)}
.log{list-style:none;margin:4px 0 0;padding:0}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.log time{color:var(--mute);font-variant-numeric:tabular-nums;grid-row:span 2;white-space:nowrap}
.log .note2{overflow-wrap:anywhere}
.log .k{font-style:normal;font-weight:600;margin-right:6px;color:var(--ink-2)}
.log .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.log .amt.in{color:var(--ok)}
.log .after{grid-column:2/4;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.log .after .link{min-height:28px;margin-left:6px;padding:0 4px}
.pfoot{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* 시트 */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet-h h2{font:400 24px/1.2 var(--font-display);overflow-wrap:anywhere}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:24px;line-height:1;color:var(--ink-2);flex:none}
.sheet-sub{margin:0 0 14px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 14px;font-size:16px}
.field textarea{padding:12px 14px;min-height:76px;resize:vertical}
.money{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 14px}
.money:focus-within{border-color:var(--ink)}
.money input{flex:1;min-width:0;border:0 !important;background:transparent !important;outline:none;font:400 34px/1 var(--font-display) !important;min-height:64px !important;text-align:right;padding:0 !important;font-variant-numeric:tabular-nums}
.money span{font:400 22px var(--font-display);color:var(--mute)}
.money.sm input{font-size:24px !important;min-height:52px !important}
.unitbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.ub{min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.ub[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.q{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:44px;border-radius:9px;border:0;background:transparent;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px}
.stepper button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600}
.stepper input{text-align:center;font:400 28px var(--font-display) !important;min-height:52px}
.expiry{display:grid;gap:8px}
.expiry input[type=date]{min-width:0}
.preview{padding:12px 14px;border-radius:12px;background:var(--val-bg);color:var(--val-ink);font-weight:600;font-variant-numeric:tabular-nums}
.preview.t{background:var(--term-bg);color:var(--term-ink)}
.preview.warn{background:var(--warn-bg);color:var(--warn)}
.preview.idle{background:var(--surface-2);color:var(--mute);font-weight:500}
.err{color:var(--bad);font-size:13px;font-weight:600}

.sheet.wide{max-width:640px}
#menu-pick{gap:10px}
.mlabel{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:4px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:4px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.mc small{font-size:11px;font-weight:500;color:var(--mute)}
.mc[aria-pressed="true"]{background:var(--val-bg);border-color:var(--val);color:var(--val-ink)}
.mc[aria-pressed="true"] small{color:var(--val-ink)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.tile{display:grid;gap:2px;text-align:left;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tile b{font-size:14px}
.tile span{font:400 22px/1.1 var(--font-display);color:var(--val-ink);font-variant-numeric:tabular-nums}
.tile[aria-pressed="true"]{background:var(--val);border-color:transparent;color:var(--on-val)}
.tile[aria-pressed="true"] span{color:var(--on-val)}
.tile:disabled{opacity:.5}
.mlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:48px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.mrow .mn{min-width:0;overflow-wrap:anywhere}
.mrow small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.mrow b{flex:none;font-variant-numeric:tabular-nums;color:var(--val-ink)}
.mrow[aria-pressed="true"]{background:var(--val-bg);border-color:var(--val)}
.picked{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.picked>.cap{padding:8px 0}
.prow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.prow .nm{flex:1 1 150px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.pamt{display:flex;align-items:center;gap:4px}
.pamt button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.pamt b{min-width:88px;text-align:right;font-variant-numeric:tabular-nums}
.pamt .del{margin-left:4px;color:var(--bad)}
.ptotal{display:flex;justify-content:space-between;padding:10px 0 4px;font-weight:700;font-variant-numeric:tabular-nums}

#toastRoot{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:480px;padding:10px 10px 10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.toast button{min-height:38px;padding:0 12px;border-radius:8px;border:1px solid currentColor;background:transparent;font-weight:700;white-space:nowrap}

/* 좁은 화면: 상세가 목록 위를 덮는다 */
@media (max-width:879px){
  .pane-detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding:env(safe-area-inset-top,0px) var(--gxr) calc(32px + env(safe-area-inset-bottom,0px)) var(--gx)}
  .app.has-sel .pane-detail{transform:none;visibility:visible;transition:transform .22s ease}
  .back{display:inline-flex;margin-top:8px}
}
/* 넓은 화면: 두 칸 */
@media (min-width:880px){
  .app{grid-template-columns:minmax(340px,400px) minmax(0,1fr);column-gap:36px;align-items:start;max-width:1280px;margin:0 auto;width:100%}
  .pane-list{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow-y:auto}
  .listhead{top:0}
  .pane-detail{padding:20px 0 48px}
  .scrim{align-items:center}
  .sheet{border-radius:18px;padding-bottom:20px}
}
/* ----- 대기화면(화면보호) ----- */
#idle{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:var(--bg);color:var(--ink);cursor:pointer;touch-action:manipulation}
#idle.on{display:flex;animation:idlein .6s ease both}
#idle .elogo{width:min(52vw,300px);height:auto;animation:idlefloat 6s ease-in-out infinite}
#idle .itime{font:400 clamp(44px,12vw,92px)/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--brand);letter-spacing:.02em}
#idle .idate{font-size:clamp(15px,3.6vw,20px);color:var(--ink-2)}
#idle .itap{margin-top:8px;font-size:14px;color:var(--mute);animation:idlepulse 3s ease-in-out infinite}
@keyframes idlein{from{opacity:0}to{opacity:1}}
@keyframes idlefloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes idlepulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#idle .elogo,#idle .itap,#idle.on{animation:none}}
@media (prefers-reduced-motion:reduce){
  .pane-detail,.skel,.hist summary::before{transition:none;animation:none}
}
</style>
<style>
#cloudRoot{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow:auto}
#cloudRoot.on{display:flex}
.cbox{width:min(440px,100%);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.cbox h2{margin:0;font:400 24px/1.2 var(--font-display)}
.cbox p{margin:0;color:var(--ink-2)}
.cbox textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px 12px;font:13px/1.4 ui-monospace,monospace}
.cbox .field input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 14px;font-size:16px}
</style>
</head>

function migrateC(c){
  if(!c||typeof c!=='object'||c.schema===2)return c;

var isSoon2=function(p){return passState(p)==='active'&&!!p.expires&&daysUntil(p.expires)<=SOON2};

  var r={bal:0,left:0,nv:0,nt:0,soon:0,soonD:999,soon2:0,soonD2:999};

  });

}

//#ledger-start
var Ledger={
  entry:function(p,kind,delta,note){var e={id:uid('l'),at:nowStr(),kind:kind,delta:delta,after:p.remaining,note:note||''};p.log.push(e);return e},
  open:function(p,total,note){p.total=total;p.remaining=total;p.log=[];return Ledger.entry(p,'open',total,note)},
  useValue:function(p,amount,note){
    amount=Math.round(Number(amount));
    if(!p||p.type!=='value'||!(amount>0)||!(p.remaining>0))return null;
    var use=Math.min(amount,p.remaining);p.remaining-=use;
    return {use:use,rest:amount-use,entry:Ledger.entry(p,'use',-use,note)};
  },
  useTerm:function(p,note){
    if(!p||p.type!=='term'||!(p.remaining>=1))return null;
    p.remaining-=1;return {use:1,entry:Ledger.entry(p,'use',-1,note)};
  },
  charge:function(p,delta,note,exp){
    delta=Math.round(Number(delta));if(!p||!(delta>0))return null;
    p.remaining+=delta;p.total+=delta;p.expires=exp||'';
    return {entry:Ledger.entry(p,'charge',delta,note)};
  },
  adjust:function(p,target,note){
    target=Math.round(Number(target));if(!p||!(target>=0)||target===p.remaining)return null;
    var d=target-p.remaining;p.remaining=target;if(target>p.total)p.total=target;
    return {delta:d,entry:Ledger.entry(p,'adjust',d,note)};
  },
  undoLast:function(p,lid){
    var e=p&&p.log[p.log.length-1];
    if(!e||e.id!==lid||e.kind!=='use'||p.remaining-e.delta<0)return false;
    p.log.pop();p.remaining-=e.delta;return true;
  },
  cancel:function(p,lid){
    if(!p)return 'none';
    var i=p.log.findIndex(function(e){return e.id===lid});if(i<0)return 'none';
    var e=p.log[i];if(e.kind!=='use'&&e.kind!=='charge')return 'kind';
    if(p.remaining-e.delta<0||p.log.slice(i+1).some(function(x){return x.after-e.delta<0}))return 'negative';
    p.log.splice(i,1);
    for(var j=i;j<p.log.length;j++)p.log[j].after-=e.delta;
    p.remaining-=e.delta;
    if(e.kind==='charge'){p.total-=e.delta;if(p.total<p.remaining)p.total=p.remaining}
    return 'ok';
  },
  check:function(p){
    var out=[],s=0;
    if(!Number.isInteger(p.remaining)||p.remaining<0)out.push('남은 값이 올바르지 않아요 ('+p.remaining+')');
    (p.log||[]).forEach(function(e,i){
      if(!Number.isInteger(e.delta)||!Number.isInteger(e.after)){out.push((i+1)+'번째 내역의 값이 정수가 아니에요');return}
      s+=e.delta;
      if(e.after!==s)out.push((i+1)+'번째 내역 뒤의 값이 '+e.after+'로 적혀 있지만 계산하면 '+s+'이에요');
    });
    if(s!==p.remaining)out.push('내역을 모두 더하면 '+s+'인데 현재 값은 '+p.remaining+'이에요');
    return out;
  },
  reconcile:function(p){
    if(!p.log.length){Ledger.entry(p,'open',p.remaining,'장부 점검으로 등록');return true}
    var s=0;p.log.forEach(function(e){s+=e.delta;e.after=s});
    if(s!==p.remaining)Ledger.entry(p,'adjust',p.remaining-s,'장부 점검으로 맞춤');
    return true;
  }
};

  customers=sampleData(new Date()).map(normC);
  saveLocal();
}
function stripId(c){var o=JSON.parse(JSON.stringify(c));delete o.id;return o}
function dbFail(err){
  var m=(err&&err.code==='invalid_argument')?'이 계정은 보기만 할 수 있어요. 수정하려면 편집 권한이 필요해요.':'저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.';
  toast(m,{ms:6000});
  if(db)db.collection('customers').get().then(function(snap){applyDocs(snap.docs);renderAll()}).catch(function(){});
}
function persist(c,fn,isNew){
  if(mode==='fb'){fbWrite(c,fn,isNew===undefined?!fn:isNew);return}
  if(db){
    var prev=writeChains[c.id]||Promise.resolve();
    var body=stripId(c);
    writeChains[c.id]=prev.catch(function(){}).then(function(){return db.collection('customers').doc(c.id).set(body)}).catch(dbFail);
  }else{snapshotDisk('하루 첫 저장 전',true);saveLocal({ids:[c.id]})}
}
function removeFromStore(id){
  if(mode==='fb'){fbDelete(id);return}
  if(db){
    var prev=writeChains[id]||Promise.resolve();
    writeChains[id]=prev.catch(function(){}).then(function(){return db.collection('customers').doc(id).delete()}).catch(dbFail);
  }else saveLocal({del:[id]});
}
/* 다른 창·탭이 먼저 바꾼 내용을 항상 반영한 뒤에 계산한다 */
function readDisk(){
  try{var raw=localStorage.getItem(LS_KEY);if(!raw)return null;var o=JSON.parse(raw);return Array.isArray(o.customers)?o.customers.map(normC):null}catch(e){return null}
}
function refreshQuiet(){if(db||mode!=='local'||!ready||!lsOk||dirtyAll)return;var l=readDisk();if(l)customers=l}
function syncFromStorage(){
  if(db||mode!=='local'||!ready||!lsOk||dirtyAll)return;
  var l=readDisk();if(!l)return;
  if(JSON.stringify(l)===JSON.stringify(customers))return;
  customers=l;if(S.sel&&!findC(S.sel))S.sel=null;renderAll();
}
window.addEventListener('storage',function(e){if(e.key===LS_KEY)syncFromStorage()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncFromStorage()});
window.addEventListener('focus',syncFromStorage);
function mutate(cid,fn){
  if(mode==='fb'&&!fbCanWrite())return null;
  refreshQuiet();
  var i=customers.findIndex(function(c){return c.id===cid});
  if(i<0){toast('고객 정보를 찾을 수 없어요. 다른 창에서 지워졌을 수 있어요. 목록을 확인해 주세요.',{ms:6000});return null}
  var c=normC(JSON.parse(JSON.stringify(customers[i])));
  if(fn(c)===false)return null;
  c.updatedAt=nowStr();
  customers[i]=c;
  persist(c,fn);
  renderAll();
  return c;
}
function applyDocs(docs){
  customers=docs.map(function(d){var o=JSON.parse(JSON.stringify(d.data()||{}));o.id=d.id;return normC(o)});
}

/* ---------- 화면: 목록 ---------- */
function visible(){
  var q=S.q.trim().toLowerCase(), qd=digits(q);
  var list=customers.filter(function(c){
    if(q){
      var hay=(c.name+' '+(c.pet||'')+' '+(c.memo||'')).toLowerCase();
      var ph=digits(c.phone);
      if(!(hay.indexOf(q)>-1||(qd.length>=2&&ph.indexOf(qd)>-1)))return false;
    }
    var s=sums(c);
    if(S.filter==='value'&&!s.nv)return false;
    if(S.filter==='term'&&!s.nt)return false;
    if(S.filter==='soon'&&!s.soon)return false;
    if(S.filter==='soon2'&&!s.soon2)return false;
    return true;
  });
  list.sort(S.sort==='name'?function(a,b){return a.name.localeCompare(b.name,'ko')}:function(a,b){return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))});
  return list;
}
function renderStatus(){
  var dot=$('#statDot'),txt=$('#statTxt'),cls='dotstat',t='불러오는 중';
  if(mode==='db'){t=dbErr?'저장소에 연결하지 못했어요':(ready?'공유 저장소에 저장 중':'불러오는 중');cls+=dbErr?' warn':(ready?' ok':'')}
  else if(mode==='fb'){t=fbErr?'서버에 연결하지 못했어요':(!ready?'불러오는 중':(fbPending?'서버에 저장 중…':(fbCache?'오프라인 · 마지막으로 받은 내용':'서버에 저장됨')));cls+=(fbErr||fbCache)?' warn':(ready?' ok':'')}
  else if(mode==='slow'){t='저장소 응답이 늦어요';cls+=' warn'}
  else if(mode==='local'){t=lsOk?(lastBackup()?'이 기기에 저장 중':'이 기기에 저장 중 · 백업 안 함'):'저장되지 않아요 (새로고침하면 사라져요)';cls+=' warn'}
  dot.className=cls;txt.textContent=t;
}
function renderChips(){
  var cnt={all:customers.length,value:0,term:0,soon:0};
  customers.forEach(function(c){var s=sums(c);if(s.nv)cnt.value++;if(s.nt)cnt.term++;if(s.soon)cnt.soon++});
  var defs=[['all','전체'],['value','정액권'],['term','월관리'],['soon','만료 임박']];
  $('#chips').innerHTML=defs.map(function(d){return '<button class="chip" type="button" data-act="filter" data-f="'+d[0]+'" aria-pressed="'+(S.filter===d[0])+'">'+d[1]+'<b>'+cnt[d[0]]+'</b></button>'}).join('');
}
function renderSummary(){
  var bal=0,left=0,soon=0,soon2=0;
  customers.forEach(function(c){var s=sums(c);bal+=s.bal;left+=s.left;soon+=s.soon;soon2+=s.soon2});
  $('#summary').innerHTML=customers.length?'<div class="sum"><div><span>월관리 남은 횟수</span><b>'+num(left)+'회</b></div><button type="button" class="sumbtn" data-act="filter-soon" aria-pressed="'+(S.filter==='soon')+'"'+(soon?'':' disabled')+'><span>'+SOON+'일 내 만료'+(soon?' ›':'')+'</span><b>'+soon+'건</b></button><button type="button" class="sumbtn" data-act="filter-soon2" aria-pressed="'+(S.filter==='soon2')+'"'+(soon2?'':' disabled')+'><span>'+SOON2+'일 내 만료'+(soon2?' ›':'')+'</span><b>'+soon2+'건</b></button></div>':'';
}
function daysSince(s){if(!s)return 9999;var d=new Date(String(s).slice(0,10)+'T00:00:00');if(isNaN(d.getTime()))return 9999;var n=new Date();n.setHours(0,0,0,0);return Math.round((n-d)/864e5)}
function auditAll(){
  var bad=[],checked=0;
  customers.forEach(function(c){
    if(c.sample)return;
    (c.passes||[]).forEach(function(p){checked++;var m=Ledger.check(p);if(m.length)bad.push({c:c,p:p,m:m})});
  });
  return {checked:checked,bad:bad};
}
function renderBanner(){
  var h='';
  var ns=customers.filter(function(c){return c.sample}).length;
  var real=customers.filter(function(c){return !c.sample});
  if(saveErr)h+='<div class="note bad"><span>'+esc(saveErr)+'</span><button class="btn sm" type="button" data-act="backup">백업</button></div>';
  if(loadWarn)h+='<div class="note bad"><span>'+esc(loadWarn)+'</span><button class="btn sm" type="button" data-act="dismiss-warn">확인</button></div>';
  var au=auditAll();
  if(au.bad.length)h+='<div class="note bad"><span>장부 점검: 계산이 맞지 않는 회원권이 '+au.bad.length+'건 있어요.</span><button class="btn sm" type="button" data-act="audit">확인</button></div>';
  if(mode==='local'&&real.length&&typeof lastBackup==='function'){
    var lb=lastBackup(),age=lb?daysSince(lb):0;

    if(lb?age>=7:daysSince(oldest)>=1)h+='<div class="note"><span>'+(lb?'마지막 백업이 '+age+'일 전이에요.':'아직 백업한 적이 없어요.')+' 기기 데이터가 지워질 때를 대비해 백업 파일을 저장해 두세요.</span><button class="btn sm" type="button" data-act="do-backup">지금 백업</button></div>';
  }
  if(ns){
    var on=S.confirm==='samples';

}

function rowHTML(c){
  var s=sums(c),tags='';
  if(s.nv)tags+='<span class="tag val">정액권 '+won(s.bal)+'</span>';
  if(s.nt)tags+='<span class="tag term">월관리 '+num(s.left)+'회</span>';
  if(s.soon2)tags+='<span class="tag warn">'+(s.soonD2<=0?'오늘 만료':'만료 D-'+s.soonD2)+'</span>';
  if(!s.nv&&!s.nt)tags='<span class="tag mute">'+(c.passes.length?'지난 회원권만 있음':'회원권 없음')+'</span>';
  return '<button class="row'+(S.sel===c.id?' on':'')+'" type="button" data-act="select" data-id="'+esc(c.id)+'">'
    +'<span class="av" aria-hidden="true">'+esc(Array.from(c.name||'?')[0])+'</span>'
    +'<span class="rmain"><span class="rname">'+esc(c.name)+(c.sample?'<em class="smp">예시</em>':'')+'</span>'
    +'<span class="rsub">'+esc(c.pet||'품종 미입력')+'</span><span class="tags">'+tags+'</span></span>'+ICON_CHEV+'</button>';
}
function renderList(){
  var el=$('#list');
  if(!ready&&mode!=='local'){el.innerHTML='<div class="rows" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';$('#count').textContent='';return}
  if(!customers.length){
    el.innerHTML='<div class="empty">'+LOGO_IMG+'<strong>아직 등록된 고객이 없어요</strong><p>고객을 등록하고 정액권이나 월관리를 만들면<br>여기에서 잔액과 남은 횟수를 한눈에 볼 수 있어요.</p><button class="btn primary" type="button" data-act="new-customer">첫 고객 등록</button></div>';
    $('#count').textContent='';return;
  }
  var list=visible();
  $('#count').textContent=(S.q||S.filter!=='all')?'검색 결과 '+list.length+'명':'고객 '+list.length+'명';
  if(!list.length){
    var q=S.q.trim();
    el.innerHTML='<div class="empty"><strong>맞는 고객이 없어요</strong><p>'+(q?'‘'+esc(q)+'’ 와 일치하는 고객을 찾지 못했어요.':'이 조건에 맞는 고객이 없어요.')+'</p>'+(q&&!/^[\d\-\s]+$/.test(q)?'<button class="btn" type="button" data-act="new-customer" data-name="'+esc(q)+'">‘'+esc(q)+'’ 새로 등록</button>':'')+'</div>';
    return;
  }
  el.innerHTML='<div class="rows">'+list.map(rowHTML).join('')+'</div>';
}

function passCard(c,p){
  var st=passState(p),ended=st!=='active',v=p.type==='value',open=!!S.open[p.id];
  var soon=isSoon2(p),n=p.expires?daysUntil(p.expires):null;
  var tags='<span class="tag '+(v?'val':'term')+'">'+(v?'정액권':'월관리')+'</span><span class="ttl">'+esc(p.title)+'</span>';
  if(st==='done')tags+='<span class="tag mute">모두 사용</span>';
  else if(st==='expired')tags+='<span class="tag bad">만료</span>';
  else if(soon)tags+='<span class="tag warn">D-'+n+'</span>';
  var body='';
  if(v){
    var pct=p.total>0?Math.max(0,Math.min(100,Math.round(p.remaining/p.total*100))):0;
    body+='<div class="big">'+num(p.remaining)+'<small>원</small></div>'
      +'<svg class="meter" viewBox="0 0 100 8" preserveAspectRatio="none" role="img" aria-label="충전액 대비 잔액 '+pct+'%"><rect class="bg" width="100" height="8"/><rect class="fg" width="'+pct+'" height="8"/></svg>'
      +'<p class="cap">충전 누계 '+won(p.total)+' 중 '+pct+'% 남음</p>';
  }else{

    +'<details class="hist" data-pid="'+p.id+'"'+(open?' open':'')+'><summary>이용 내역 '+p.log.length+'건</summary><ol class="log">'+(log||'<li><span class="note2">아직 내역이 없어요.</span></li>')+'</ol>'

function stepper(id,val){

var BONUS_RATE=0.1;
var PLANS={300000:{spa:1,months:5},500000:{spa:2,months:8}};
function planPicker(){
  return '<div class="field"><label>정액권 선택</label><div class="mchips" id="plans">'
   +[300000,500000].map(function(a){var pl=PLANS[a];return '<button class="mc" type="button" data-plan="'+a+'" aria-pressed="false"><span>'+(a/10000)+'만원</span><small>스파 '+pl.spa+'회 · '+pl.months+'개월</small></button>'}).join('')
   +'</div></div><p class="cap">보너스는 충전 금액의 10%가 자동으로 더해져요. 스파 이용권은 월관리로 함께 만들어져요.</p>';

function planText(a,base){var b=bonusOf(a),pl=PLANS[a];return '충전 '+won(a)+' + 보너스 '+won(b)+' = '+(base===undefined?'등록 잔액 '+won(a+b):'충전 후 잔액 '+won(base+a+b))+' · 스파 '+pl.spa+'회 · 유효 '+pl.months+'개월'}
function spaPass(a,exp){var pl=PLANS[a],p={id:uid('p'),type:'term',title:'스파 '+pl.spa+'회권',expires:exp,createdAt:nowStr(),log:[]};Ledger.open(p,pl.spa,(a/10000)+'만원 정액권 혜택 · 스파 '+pl.spa+'회');return p}
function bindPlans(root,onPick,keep){
  $$('[data-plan]',root).forEach(function(b){b.addEventListener('click',function(){
    var a=Number(b.dataset.plan);
    $$('[data-plan]',root).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
    var f=$('#f-exp',root);if(f){var ne=addMonthsStr(PLANS[a].months);f.value=(keep&&keep>ne)?keep:ne;f.dispatchEvent(new Event('input',{bubbles:true}))}
    onPick(a);
  })});
}
function bonusOf(paid){return Math.round(paid*BONUS_RATE)}
function unitOf(el){var w=el.closest('.money');return w?(Number(w.dataset.unit)||1):1}
function setUnit(wrap,u){
  wrap.dataset.unit=String(u);
  var sp=$('span',wrap);if(sp)sp.textContent=u>1?'만원':'원';
  var bar=wrap.nextElementSibling;
  if(bar&&bar.classList.contains('unitbar'))$$('.ub',bar).forEach(function(b){b.setAttribute('aria-pressed',String(Number(b.dataset.u)===u))});
}
var numOf=function(el){var m=unitOf(el);return (Number(digits(el.value).slice(0,m>1?6:10))||0)*m};
function setMoney(el,n){
  var w=el.closest('.money'),u=unitOf(el);
  if(w&&u>1&&n%u!==0){setUnit(w,1);u=1}
  var shown=u>1?Math.round(n/u):n;
  el.value=shown?num(shown):'';
  el.dispatchEvent(new Event('input',{bubbles:true}));
}

function openNewPass(cid){
  var c=findC(cid);if(!c)return;
  openSheet(c.name+' · 회원권 추가','<form id="f-pass" class="form" novalidate>'
    +'<div class="seg" role="group" aria-label="회원권 종류"><button type="button" data-kind="value" aria-pressed="true">정액권 (금액)</button><button type="button" data-kind="term" aria-pressed="false">월관리 (횟수)</button></div>'
    +'<div class="field"><label for="f-title">이름</label><input id="f-title" maxlength="30" value="정액권" autocomplete="off"></div>'
    +'<div data-for="value" class="form">'+planPicker()+'</div>'
    +'<div data-for="term" class="form" hidden><div class="field"><label for="f-count">총 횟수</label>'+stepper('f-count',5)+'</div>'
    +'<div class="quick"><button class="q" type="button" data-setn="4" data-to="f-count">4회</button><button class="q" type="button" data-setn="5" data-to="f-count">5회</button><button class="q" type="button" data-setn="10" data-to="f-count">10회</button></div>'
    +'<div class="field"><label>세트 선택 (선택)</label><div class="mchips" id="tplans">'
    +['A','B'].map(function(k){var t=TPLANS[k];return '<button class="mc" type="button" data-tplan="'+k+'" aria-pressed="false"><span>'+k+' · '+esc(t.label)+'</span><small>'+esc(t.sub)+'</small></button>'}).join('')
    +'</div></div></div>'
    +expiryField('')
    +'<div id="pv" class="preview idle" aria-live="polite"></div><p class="err" id="sheet-err" role="alert" hidden></p>'
    +'<button class="btn val block" id="go" type="submit">회원권 만들기</button></form>',function(root){
      var form=$('#f-pass',root),kind='value',plan=0,tplan='';
      function upd(){
        var pv=$('#pv',root),go=$('#go',root);
        if(kind==='value'){
          pv.className='preview'+(plan?'':' idle');pv.textContent=plan?planText(plan):'30만원 또는 50만원을 선택하세요';
          go.className='btn val block';
        }else{
          var n=Number(digits($('#f-count',root).value))||0,tp=tplan&&TPLANS[tplan];
          pv.className='preview t'+(n?'':' idle');pv.textContent=n?(tp?tp.label.replace('위생목욕 4회','위생목욕 '+n+'회')+' · 유효 '+tp.weeks+'주':'총 '+n+'회'):'횟수를 입력하세요';
          go.className='btn term block';
        }
      }
      $$('[data-kind]',root).forEach(function(b){b.addEventListener('click',function(){
        var k=b.dataset.kind;if(k===kind)return;
        var ti=$('#f-title',root),oldDef=kind==='value'?'정액권':'월관리';
        if(ti.value.trim()===oldDef||!ti.value.trim()||/^월관리 [AB] \(/.test(ti.value.trim()))ti.value=k==='value'?'정액권':'월관리';
        kind=k;
        if(k==='value'){tplan='';$$('[data-tplan]',root).forEach(function(x){x.setAttribute('aria-pressed','false')})}
        $$('[data-kind]',root).forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.kind===k))});
        $$('[data-for]',root).forEach(function(x){x.hidden=x.dataset.for!==k});
        $$('[data-qk]',root).forEach(function(x){x.hidden=x.dataset.qk!==k});
        upd();sheetErr('');
      })});
      $$('[data-tplan]',root).forEach(function(b){b.addEventListener('click',function(){
        var k=b.dataset.tplan,ti=$('#f-title',root),cnt=$('#f-count',root),f=$('#f-exp',root);
        if(tplan===k){tplan='';b.setAttribute('aria-pressed','false');if(/^월관리 [AB] \(/.test(ti.value.trim()))ti.value='월관리';upd();return}
        tplan=k;$$('[data-tplan]',root).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
        ti.value=TPLANS[k].title;cnt.value=4;f.value=addDaysStr(TPLANS[k].weeks*7);
        sheetErr('');upd();
      })});
      form.addEventListener('input',upd);bindPlans(root,function(a){plan=a;sheetErr('');upd()});upd();
      S.onSubmit=function(){
        var title=$('#f-title',root).value.trim()||(kind==='value'?'정액권':'월관리');
        var exp=$('#f-exp',root).value||'';
        var p={id:uid('p'),type:kind,title:title,expires:exp,createdAt:nowStr(),log:[]},note,extra=null;
        if(kind==='value'){
          if(!plan){sheetErr('30만원 또는 50만원을 선택해 주세요.');return}
          var paid=plan,bonus=bonusOf(paid),tot=paid+bonus;
          note=won(paid)+' 충전'+(bonus?' + 보너스 '+won(bonus):'');
          Ledger.open(p,tot,note);
          extra=spaPass(plan,exp);
        }else{
          var n=Number(digits($('#f-count',root).value))||0;
          if(n<1||n>99){sheetErr('횟수는 1회에서 99회 사이로 입력해 주세요.');return}
          Ledger.open(p,n,n+'회 등록'+(tplan?' · 세트 '+tplan:''));
          if(tplan&&TPLANS[tplan].extra){
            extra={id:uid('p'),type:'term',title:TPLANS[tplan].extra,expires:exp,createdAt:nowStr(),log:[]};
            Ledger.open(extra,4,'4회 등록 · 세트 '+tplan);
          }
        }
        var made=mutate(cid,function(x){x.passes.push(p);if(extra)x.passes.push(extra)});closeSheet();if(made)toast(title+' 회원권을 만들었어요');
      };
    });
}

/* ----- 금액 차감 시트 (메뉴에서 고르기 / 금액 직접 입력) ----- */
function openUse(cid,pid){
  var c=findC(cid),p=c&&findP(c,pid);if(!p)return;
  var M={mode:'menu',size:null,tier:null,svc:null,items:[]};
  function sum(){return M.items.reduce(function(a,i){return a+i.amt},0)}
  function man(n){return (n/10000).toFixed(1)+'만'}
  function has(key){return M.items.some(function(i){return i.key===key})}
  function syncBase(){
    M.items=M.items.filter(function(i){return i.key!=='base'});

/* ---------- 백업 · 복원 (이 기기의 저장 내용을 파일로 옮긴다) ---------- */
var LS_BK='hoewonkwon-jangbu/lastBackup';
var ID_OK=/^[A-Za-z0-9_\-]{1,60}$/;
function lastBackup(){try{return localStorage.getItem(LS_BK)||''}catch(e){return ''}}
function exportBackup(){
  var data={app:'hoewonkwon-jangbu',version:2,exportedAt:nowStr(),customers:customers};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='회원권장부-백업-'+ymd(new Date())+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
  try{localStorage.setItem(LS_BK,nowStr())}catch(e){}
}
function cleanStr(v,n){return String(v==null?'':v).slice(0,n)}
function cleanNum(v){v=Number(v);return isFinite(v)?Math.round(v):0}
function cleanCustomer(c){
  if(!c||typeof c!=='object'||!ID_OK.test(String(c.id||''))||!String(c.name||'').trim())return null;
  var o={id:String(c.id),name:cleanStr(c.name,30),pet:cleanStr(c.pet,40),phone:cleanStr(c.phone,20),memo:cleanStr(c.memo,200),
    createdAt:cleanStr(c.createdAt,16),updatedAt:cleanStr(c.updatedAt,16),schema:2,passes:[]};
  if(c.sample)o.sample=true;
  (Array.isArray(c.passes)?c.passes:[]).forEach(function(p){
    if(!p||!ID_OK.test(String(p.id||''))||(p.type!=='value'&&p.type!=='term'))return;
    var q={id:String(p.id),type:p.type,title:cleanStr(p.title,30)||(p.type==='value'?'정액권':'월관리'),total:cleanNum(p.total),remaining:cleanNum(p.remaining),
      expires:/^\d{4}-\d{2}-\d{2}$/.test(String(p.expires||''))?p.expires:'',createdAt:cleanStr(p.createdAt,16),log:[]};
    (Array.isArray(p.log)?p.log:[]).forEach(function(e){
      if(!e||!ID_OK.test(String(e.id||'')))return;
      var k=['open','use','charge','adjust'].indexOf(e.kind)>-1?e.kind:'adjust';
      q.log.push({id:String(e.id),at:cleanStr(e.at,16),kind:k,delta:cleanNum(e.delta),after:cleanNum(e.after),note:cleanStr(e.note,200)});
    });
    o.passes.push(q);
  });
  return o;
}
function importBackup(text){
  var o;
  try{o=JSON.parse(text)}catch(e){return {ok:false,msg:'백업 파일을 읽지 못했어요. 이 앱에서 저장한 .json 파일인지 확인해 주세요.'}}
  if(!o||!Array.isArray(o.customers))return {ok:false,msg:'이 앱의 백업 파일이 아니에요.'};
  var added=0,updated=0,kept=0,skipped=0,touched=[];snapshotDisk('백업 불러오기 직전');refreshQuiet();
  o.customers.forEach(function(raw){
    var c=cleanCustomer(migrateC(raw));if(!c){skipped++;return}
    var cur=findC(c.id);
    if(!cur){customers.push(normC(c));touched.push(c.id);added++}
    else if(String(c.updatedAt)>String(cur.updatedAt||'')){customers[customers.indexOf(cur)]=normC(c);touched.push(c.id);updated++}
    else kept++;
  });
  if(mode==='fb'){touched.forEach(function(id){var cc=findC(id);if(cc)fbWrite(cc,null,true)})}else saveLocal({ids:touched});renderAll();
  return {ok:true,msg:'새 고객 '+added+'명을 추가하고, '+updated+'명은 백업의 최신 내용으로 바꿨어요.'+(kept?' ('+kept+'명은 이 기기의 내용이 더 최신이라 그대로 뒀어요.)':'')+(skipped?' '+skipped+'건은 형식이 맞지 않아 건너뛰었어요.':'')};
}
function openBackup(){

function fbPendDone(){fbPending=Math.max(0,fbPending-1);renderStatus()}
function fbQueue(id,job){
  var prev=writeChains[id]||Promise.resolve();
  fbPending++;renderStatus();
  var p=prev.catch(function(){}).then(job).then(function(r){fbPendDone();return r},function(er){fbPendDone();toast(fbMsg(er),{ms:8000});fbResync()});
  writeChains[id]=p;return p;
}
/* 서버에 쓸 때는 항상 서버의 최신 내용을 읽어서, 다른 기기가 먼저 바꿨으면 그 위에 같은 작업을 다시 적용한다 */
function fbWrite(c,fn,isNew){
  var ref=fs.collection('customers').doc(c.id),baseRev=c.rev||0,mine=JSON.parse(JSON.stringify(c));
  snapshotDisk('하루 첫 저장 전',true);
  return fbQueue(c.id,function(){
    return fs.runTransaction(function(tx){
      return tx.get(ref).then(function(snap){
        var body,srev=snap.exists?(snap.data().rev||0):0;
        if(!snap.exists){
          if(!isNew&&baseRev>0)throw {code:'gone'};
          body=stripId(mine);
        }else if(isNew||srev===baseRev){
          body=stripId(mine);
        }else{
          var o=normC(Object.assign({id:c.id},JSON.parse(JSON.stringify(snap.data()))));
          if(fn&&fn(o)===false)throw {code:'abort'};
          o.updatedAt=nowStr();body=stripId(o);
        }
        body=JSON.parse(JSON.stringify(body));body.rev=srev+1;
        tx.set(ref,body);return body.rev;
      });
    }).then(function(rev){var cur=findC(c.id);if(cur&&(cur.rev||0)===baseRev)cur.rev=rev;return rev});
  });
}
function fbDelete(id){
  var ref=fs.collection('customers').doc(id);
  snapshotDisk('고객 삭제 직전');
  return fbQueue(id,function(){return fs.runTransaction(function(tx){return tx.get(ref).then(function(s){if(s.exists)tx.delete(ref)})})});
}

    case 'new-customer':openCustomer(null,a.dataset.name||'');break;
    case 'backup':openBackup();break;
    case 'restore':var ri=Number(a.dataset.i);if(S.confirm==='restore:'+ri){S.confirm=null;if(restoreSnap(ri)){closeSheet();toast('자동 보관본으로 복구했어요. 목록을 확인해 주세요.',{ms:6000})}else toast('복구하지 못했어요.')}else{S.confirm='restore:'+ri;openBackup();setTimeout(function(){if(S.confirm==='restore:'+ri){S.confirm=null;var h2=$('.sheet h2');if(h2&&h2.textContent.indexOf('백업')===0)openBackup()}},4000)}break;
    case 'do-backup':exportBackup();toast('백업 파일을 저장했어요. 다운로드 폴더를 확인하세요.');break;
    case 'edit-customer':openCustomer(cid);break;
    case 'del-customer':if(S.confirm==='cust:'+cid){S.confirm=null;var nm=(findC(cid)||{}).name;snapshotDisk('고객 삭제 직전');removeCustomer(cid);renderAll();toast((nm||'고객')+' 기록을 삭제했어요')}else askConfirm('cust:'+cid);break;
    case 'new-pass':openNewPass(cid);break;
    case 'use-value':openUse(cid,pid);break;
    case 'use-term':useTerm(cid,pid);break;
    case 'topup':openTopup(cid,pid);break;
    case 'adjust':openAdjust(cid,pid);break;
    case 'cancel-log':if(S.confirm==='log:'+a.dataset.lid){S.confirm=null;snapshotDisk('내역 취소 직전');cancelLog(cid,pid,a.dataset.lid)}else askConfirm('log:'+a.dataset.lid);break;
    case 'edit-pass':openEditPass(cid,pid);break;
    case 'del-pass':if(S.confirm==='pass:'+pid){S.confirm=null;snapshotDisk('회원권 삭제 직전');mutate(cid,function(x){x.passes=x.passes.filter(function(p){return p.id!==pid})});toast('회원권을 삭제했어요')}else askConfirm('pass:'+pid);break;
    case 'clear-samples':
      if(S.confirm==='samples'){S.confirm=null;customers.filter(function(c){return c.sample}).forEach(function(c){removeCustomer(c.id)});renderAll();toast('예시 고객을 지웠어요')}
      else askConfirm('samples');break;
    case 'audit':openAudit();break;
    case 'reconcile':snapshotDisk('장부 점검 직전');mutate(a.dataset.cid,function(x){var pp=findP(x,a.dataset.pid);if(!pp)return false;Ledger.reconcile(pp)});openAudit();toast('내역을 맞췄어요');break;
    case 'dismiss-warn':loadWarn='';renderBanner();break;
    case 'copy-phone':
      try{navigator.clipboard.writeText(a.dataset.v).then(function(){toast('전화번호를 복사했어요')},function(){toast('복사하지 못했어요. 번호를 길게 눌러 복사해 주세요.')})}catch(err){toast('복사하지 못했어요. 번호를 길게 눌러 복사해 주세요.')}
      break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.closest)return;
  if(t.closest('.money')){var mu=unitOf(t);var d=digits(t.value).slice(0,mu>1?6:10);var f=d?num(Number(d)):'';if(t.value!==f)t.value=f}
  else if(t.closest('.stepper')&&t.tagName==='INPUT'){var d2=digits(t.value).slice(0,2);if(t.value!==d2)t.value=d2}
});
var lastSubmitAt=0;
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(!S.onSubmit||Date.now()-lastSubmitAt<700)return;     /* 두 번 눌려도 한 번만 */
  var before=$('#sheetRoot').firstChild;
  S.onSubmit();
  if($('#sheetRoot').firstChild!==before)lastSubmitAt=Date.now();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#sheetRoot').firstChild)closeSheet()});
document.addEventListener('toggle',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('hist')){S.open[t.dataset.pid]=t.open}},true);
$('#q').addEventListener('input',function(e){S.q=e.target.value;renderList()});
$('#sort').addEventListener('change',function(e){S.sort=e.target.value;renderList()});

/* ---------- 시작 ---------- */
/* ---------- 대기화면: 일정 시간 아무것도 안 하면 로고 화면으로 덮어 고객 정보를 가린다 ---------- */
var IDLE_MS=1*60*1000,idleAt=Date.now(),idleOn=false,idleEl=null,idleTick=null;
function idleShow(){
  if(idleOn)return;
  if(!idleEl){idleEl=document.createElement('div');idleEl.id='idle';idleEl.setAttribute('role','button');idleEl.setAttribute('aria-label','화면을 터치하면 다시 시작해요');document.body.appendChild(idleEl)}
  idleEl.innerHTML=LOGO_IMG+'<div class="itime" id="idleTime"></div><div class="idate" id="idleDate"></div><div class="itap">화면을 터치하면 시작돼요</div>';
  idleClock();idleEl.classList.add('on');idleOn=true;
  idleTick=setInterval(idleClock,15000);
}
function idleClock(){
  var d=new Date(),t=document.getElementById('idleTime'),e=document.getElementById('idleDate');if(!t)return;
  t.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  e.textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'.charAt(d.getDay())+'요일';
}
function idleHide(){
  if(!idleOn)return;
  idleOn=false;clearInterval(idleTick);idleEl.classList.remove('on');idleAt=Date.now();
  try{if(typeof syncFromStorage==='function')syncFromStorage()}catch(e){}
}
function idleTouch(e){
  if(idleOn){
    if(e&&e.type==='pointerdown'||e&&e.type==='keydown'){e.preventDefault();e.stopPropagation();idleHide()}
    return;
  }
  idleAt=Date.now();
}
['pointerdown','keydown','wheel','touchstart'].forEach(function(n){document.addEventListener(n,idleTouch,true)});
document.addEventListener('pointermove',function(){if(!idleOn)idleAt=Date.now()},{passive:true});
document.addEventListener('click',function(e){if(idleOn){e.preventDefault();e.stopPropagation()}},true);
setInterval(function(){if(!idleOn&&Date.now()-idleAt>=IDLE_MS)idleShow()},5000);

function afterLoad(){
  if(!autoSel&&customers.length&&!S.sel&&window.matchMedia('(min-width:880px)').matches){
    S.sel=customers.slice().sort(function(a,b){return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))})[0].id;autoSel=true;
  }
  if(S.sel&&!findC(S.sel))S.sel=null;
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
renderAll();
(function boot(){cloudBoot()
})();
})();
</script>
</body>
</html>
